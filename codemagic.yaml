workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: SMRC_ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smroyalcircle.app
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Create iOS project if missing (Android is not touched)
        script: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist.ours
            cp ios/Runner/Runner.entitlements /tmp/Runner.entitlements.ours
            flutter create --platforms=ios --project-name sm_royal_circle --org com.smroyalcircle .
            cp /tmp/Info.plist.ours ios/Runner/Info.plist
            cp /tmp/Runner.entitlements.ours ios/Runner/Runner.entitlements
          fi

      - name: Apply bundle ID, entitlements, deployment target
        script: |
          gem install xcodeproj --no-document
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
          project.targets.each do |target|
            next unless target.name == "Runner"
            target.build_configurations.each do |config|
              config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.smroyalcircle.app"
              config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "Runner/Runner.entitlements"
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
            end
          end
          project.save
          '
          perl -pi -e "s/^# *platform :ios.*/platform :ios, '\''15.0'\''/" ios/Podfile

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update

      - name: Set up signing profiles on the Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
