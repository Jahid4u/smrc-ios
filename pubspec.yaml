name: sm_royal_circle
description: SM Royal Circle — luxury invitation-only private members club app.
publish_to: 'none'
version: 1.0.0+132

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Push notifications
  onesignal_flutter: ^5.1.3

  # Payments — Google Pay (Android) / Apple Pay (iOS) via Stripe.
  # Stripe is required underneath both: neither Google Pay nor Apple Pay can
  # move money on their own, they only hand back a tokenised card, and a
  # real payment processor (Stripe here) is what actually charges it. This
  # package's PlatformPay API shows ONLY the native Google Pay / Apple Pay
  # button — never a card entry form.
  flutter_stripe: ^11.3.0

  # Local storage / session
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Fonts (Cormorant Garamond + Inter, matching admin panel)
  # Fonts are bundled locally (assets/fonts) — see the `fonts:` section below.
  # google_fonts removed: it fetched fonts over the network at runtime and
  # could block the app's first frame while waiting on that request.

  # Images
  url_launcher: ^6.3.0
  app_links: ^6.3.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

# path_provider_android is pulled in transitively (by shared_preferences /
# flutter_secure_storage / image_picker — nothing in our own dependencies
# list above references it directly). Its newer releases (2.3.x) switched
# to JNI-based generated bindings (path_provider.g.dart referencing JObject,
# JString, JArray, jNullReference, etc.) that only compile against a
# matching `jni` package version. When pub resolves an incompatible
# combination, the Gradle build fails with a wall of "'JObject' isn't a
# type" / "Undefined name 'jNullReference'" errors from that generated file
# — nothing wrong in our own code. Pinning to 2.2.x sidesteps the JNI
# codegen entirely (it uses the older, plain Kotlin/MethodChannel
# implementation), which is all this app actually needs.
dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # assets/icons/ is deliberately NOT listed here. Those PNGs
    # (app_icon.png / app_icon_foreground.png, ~720KB) are only read at BUILD
    # time by flutter_launcher_icons through its own `image_path` setting —
    # no Dart code ever loads them. Listing them under `assets:` baked them
    # into every APK/IPA for nothing. The files stay on disk so icon
    # regeneration keeps working; they just no longer ship to devices.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

# Native (OS-level) splash — shown the instant the app launches, before the
# Flutter engine starts, so there is no black/white flash. Matches the
# reference design 1:1: phoenix mark + "SM Royal Circle" + "TRUE EXCLUSIVITY.
# REAL COMMUNITY." + "NYC'S #1 ELITE SOCIAL CLUB" (baked into one composite
# PNG, assets/images/splash_native.png, since a native splash cannot lay out
# separate text widgets) on a plain ink background, with the gold divider
# line as a separate bottom "branding" image (assets/images/splash_branding.png).
#
# HEADS UP — the Android side is now HAND-MAINTAINED, not generated:
# android/app/src/main/res/drawable*/launch_background.xml plus the
# splash_image/splash_branding PNGs in all five density buckets are committed
# directly. Do NOT run `dart run flutter_native_splash:create` for Android —
# it would overwrite those files with its own layout. This block is kept only
# so the iOS splash can be generated once the ios/ folder exists:
#     flutter create --platforms=ios .
#     dart run flutter_native_splash:create
# (then re-check the Android drawables are still the ones below).
flutter_native_splash:
  color: "#0A0A0B"
  image: assets/images/splash_native.png
  branding: assets/images/splash_branding.png
  branding_mode: bottom
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0A0A0B"
    image: assets/images/splash_native.png
    branding: assets/images/splash_branding.png
